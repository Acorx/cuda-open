[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-open"
version = "0.1.0"
description = "Revolutionary Computing via Neuro-Symbolic Evolution"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Acorx Team", email = "arthur@cuda-open.dev"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://github.com/Acorx/cuda-open"
Repository = "https://github.com/Acorx/cuda-open"
Documentation = "https://github.com/Acorx/cuda-open#readme"
