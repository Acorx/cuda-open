# CUDA Open - Module PyTorch
# Installation: pip install -e .

from setuptools import setup, find_packages

with open("README_FINAL.md", "r", encoding="utf-8") as fh:
    long_description = fh.read()

setup(
    name="cuda-open",
    version="0.1.0",
    author="CUDA Open Team",
    author_email="team@cuda-open.dev",
    description="Revolutionary Computing via Neuro-Symbolic Evolution",
    long_description=long_description,
    long_description_content_type="text/markdown",
    url="https://github.com/your-org/cuda-open",
    packages=find_packages(),
    classifiers=[
        "Development Status :: 3 - Alpha",
        "Intended Audience :: Science/Research",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Topic :: Scientific/Engineering :: Artificial Intelligence",
    ],
    python_requires=">=3.10",
    install_requires=[
        "torch>=2.0.0",
        "transformers>=4.30.0",
        "numpy>=1.24.0",
    ],
    extras_require={
        "dev": [
            "pytest",
            "black",
            "flake8",
        ],
    },
)
