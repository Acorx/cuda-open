name: CI

on:
  push:
    branches: [main]

jobs:
  test-quantization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install numpy
      
      - name: Test quantizer
        run: |
          python3 -c "
          import numpy as np
          import sys
          sys.path.insert(0, '.')
          from cuda_open.quantizer import BitNetQuantizer
          
          # Test 1: Basic quantization
          data = np.random.randn(100).astype(np.float32)
          ternary, scale = BitNetQuantizer.quantize(data)
          
          # Check ternary values
          unique = set(np.unique(ternary))
          assert unique.issubset({-1.0, 0.0, 1.0}), f'Bad values: {unique}'
          print(f'✓ Test 1: Ternary OK (values: {unique})')
          
          # Test 2: Scale is reasonable
          assert 0.01 < scale < 10.0, f'Scale out of range: {scale}'
          print(f'✓ Test 2: Scale OK ({scale:.3f})')
          
          # Test 3: Compression
          packed = np.packbits((ternary + 1).astype(np.int8))
          assert len(packed) < len(data)
          print(f'✓ Test 3: Compression OK')
          
          print('\\n✓ All quantization tests passed!')
          "

  test-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install numpy
      
      - name: Quick evolution test
        run: |
          python3 -c "
          import numpy as np
          
          # Simulate tiny evolution
          pop_size = 10
          genes = 5
          population = np.random.randn(pop_size, genes)
          
          # Simple fitness
          fitness = -np.sum(population**2, axis=1)
          best_idx = np.argmax(fitness)
          
          print(f'✓ Population: {population.shape}')
          print(f'✓ Best fitness: {fitness[best_idx]:.3f}')
          
          # Mutation
          population[best_idx] += np.random.randn(genes) * 0.1
          new_fitness = -np.sum(population[best_idx]**2)
          print(f'✓ After mutation: {new_fitness:.3f}')
          
          print('\\n✓ Evolution simulation OK!')
          "
