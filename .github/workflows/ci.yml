name: CI

on:
  push:
    branches: [main]

jobs:
  test-quantization:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install numpy

      - name: Test quantizer
        run: |
          python3 -c "
          import numpy as np
          import sys
          sys.path.insert(0, 'src') # Point to src/ directory
          from cuda_open.quantizer import BitNetQuantizer

          # Test 1: Basic quantization
          data = np.random.randn(100).astype(np.float32)
          packed, scale = BitNetQuantizer.quantize(data)

          # Verify return types
          assert packed.dtype == np.uint8, 'Packed should be uint8'
          print(f'✓ Test 1: Quantization returns packed uint8 array')

          # Test 2: Scale is reasonable
          assert 0.01 < scale < 10.0, f'Scale out of range: {scale}'
          print(f'✓ Test 2: Scale OK ({scale:.3f})')

          # Test 3: Compression (4 values per byte)
          expected_size = (len(data) + 3) // 4
          assert len(packed) == expected_size, f'Size mismatch: {len(packed)} vs {expected_size}'
          print(f'✓ Test 3: Compression ratio is exactly 4x (approx 16x bits)')

          # Test 4: Unpacking consistency
          reconstructed = BitNetQuantizer.unpack(packed, len(data), scale)
          assert len(reconstructed) == len(data)
          # Check that values are scaled ternary {-scale, 0, scale}
          unique_vals = set(np.unique(reconstructed / scale))
          assert unique_vals.issubset({-1.0, 0.0, 1.0}), f'Bad ternary values: {unique_vals}'
          print(f'✓ Test 4: Unpacked values are valid ternary {{-1, 0, 1}}')

          print('\n✓ All quantization tests passed!')
          "

  test-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install numpy

      - name: Quick evolution test
        run: |
          python3 -c "
          import numpy as np

          # Simulate tiny evolution
          pop_size = 10
          genes = 5
          population = np.random.randn(pop_size, genes)

          # Simple fitness
          fitness = -np.sum(population**2, axis=1)
          best_idx = np.argmax(fitness)

          print(f'✓ Population: {population.shape}')
          print(f'✓ Best fitness: {fitness[best_idx]:.3f}')

          # Mutation
          population[best_idx] += np.random.randn(genes) * 0.1
          new_fitness = -np.sum(population[best_idx]**2)
          print(f'✓ After mutation: {new_fitness:.3f}')

          print('\n✓ Evolution simulation OK!')
          "
